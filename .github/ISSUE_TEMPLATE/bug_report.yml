name: Bug report / 问题反馈
description: Report a reproducible issue without private data.
body:
  - type: markdown
    attributes:
      value: Do not include keys, account exports, private URLs or raw live responses. Use private reporting for security vulnerabilities.
  - type: input
    id: environment
    attributes:
      label: Commit, Node version and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Prefer a mock response or a redacted configuration.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
